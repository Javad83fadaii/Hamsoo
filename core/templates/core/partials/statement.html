<!-- ==================== صفحه ۵: بیانیه گام اول ==================== -->
<section id="statement" class="page-section">
  <div class="mb-6 pb-3 border-b border-amber-200">
    <button type="button" data-nav="home" class="text-xs text-amber-700 mb-1 hover:underline flex items-center gap-1">
      <i class="fas fa-arrow-right"></i> بازگشت به صفحه اصلی
    </button>
    <h2 class="text-2xl sm:text-3xl font-black text-amber-900">بیانیه گام اول و مرام‌نامه همسو</h2>
  </div>

  <div class="glass-card p-6 sm:p-8 rounded-3xl max-w-4xl mx-auto border-2 border-amber-300">
    <div class="text-center mb-6">
      <span class="text-xs font-bold text-amber-700 bg-amber-100 px-3 py-1 rounded-full">{{ site.statement_subtitle }}</span>
      <h3 class="text-2xl font-black text-neutral-800 mt-2">{{ site.statement_title }}</h3>
    </div>

    <div class="space-y-4 text-xs sm:text-sm text-neutral-700 leading-loose text-justify">
      <p>{{ site.statement_intro|linebreaksbr }}</p>

      {% for principle in principles %}
        <div class="bg-amber-50 p-4 rounded-2xl border-r-4 border-r-amber-500 my-4">
          <h4 class="font-bold text-amber-900 mb-1">{{ principle.title }}</h4>
          <p>{{ principle.body|linebreaksbr }}</p>
        </div>
      {% empty %}
        <p class="text-xs text-neutral-500 text-center">اصول بیانیه هنوز ثبت نشده است.</p>
      {% endfor %}
    </div>
  </div>
</section>
