<!-- ==================== صفحه ۴: همسو در بستر دانشگاه ==================== -->
<section id="university" class="page-section">
  <div class="mb-6 pb-3 border-b border-amber-200">
    <button type="button" data-nav="home" class="text-xs text-amber-700 mb-1 hover:underline flex items-center gap-1">
      <i class="fas fa-arrow-right"></i> بازگشت به صفحه اصلی
    </button>
    <h2 class="text-2xl sm:text-3xl font-black text-amber-900">همسو در بستر دانشگاه</h2>
  </div>

  <div class="glass-card p-6 rounded-3xl mb-8">
    <div class="max-w-3xl">
      <h3 class="text-xl font-bold text-amber-900 mb-3">{{ site.university_title }}</h3>
      <p class="text-sm text-neutral-700 leading-relaxed text-justify mb-4">
        {{ site.university_intro|linebreaksbr }}
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
      {% for feature in features %}
        <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
          <i class="fas {{ feature.icon }} text-amber-600 text-2xl mb-2"></i>
          <h4 class="font-bold text-neutral-800 text-sm mb-1">{{ feature.title }}</h4>
          <p class="text-xs text-neutral-600">{{ feature.body|linebreaksbr }}</p>
        </div>
      {% empty %}
        <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200 md:col-span-3 text-center">
          <p class="text-xs text-neutral-500">فعالیت‌های دانشگاهی هنوز ثبت نشده است.</p>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
